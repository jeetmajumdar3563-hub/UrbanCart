<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanCart Store</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="UrbanCart home">
      <span class="brand-mark">UC</span>
      <span>UrbanCart</span>
    </a>

    <label class="search-box">
      <span>Search</span>
      <input id="searchInput" type="search" placeholder="Search products">
    </label>

    <button class="cart-button" id="cartToggle" type="button" aria-expanded="false" aria-controls="cartPanel">
      <span class="cart-icon" aria-hidden="true">Bag</span>
      <span>Cart</span>
      <strong id="cartCount">0</strong>
    </button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p>New arrivals are live</p>
        <h1>UrbanCart</h1>
        <span>Fresh essentials, smart tech, and everyday style with fast checkout.</span>
        <a href="#products" class="primary-link">Shop collection</a>
      </div>
    </section>

    <section class="shop-shell" id="products">
      <aside class="filters" aria-label="Product filters">
        <h2>Categories</h2>
        <div class="filter-list" id="categoryFilters"></div>
      </aside>

      <section class="catalog" aria-live="polite">
        <div class="section-heading">
          <div>
            <p>Curated picks</p>
            <h2>Featured Products</h2>
          </div>
          <select id="sortSelect" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </section>
    </section>
  </main>

  <aside class="cart-panel" id="cartPanel" aria-label="Shopping cart">
    <div class="cart-header">
      <div>
        <p>Your order</p>
        <h2>Shopping Cart</h2>
      </div>
      <button class="icon-button" id="closeCart" type="button" aria-label="Close cart">x</button>
    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-summary">
      <div>
        <span>Subtotal</span>
        <strong id="subtotal">$0.00</strong>
      </div>
      <div>
        <span>Shipping</span>
        <strong id="shipping">$0.00</strong>
      </div>
      <div class="total-row">
        <span>Total</span>
        <strong id="total">$0.00</strong>
      </div>
      <button class="checkout-button" id="checkoutButton" type="button">Checkout</button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>
  <script src="script.js"></script>
</body>
</html>
